services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buergermeldebox-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/buergermeldebox
      SPRING_DATASOURCE_USERNAME: buergermeldebox
      SPRING_DATASOURCE_PASSWORD: buergermeldebox
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: buergermeldebox-db
    environment:
      POSTGRES_DB: buergermeldebox
      POSTGRES_USER: buergermeldebox
      POSTGRES_PASSWORD: buergermeldebox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buergermeldebox -d buergermeldebox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: