name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Java Anwendung bauen und testen
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4.2.2

    - name: Java 21 einrichten
      uses: actions/setup-java@v5 #Aktualisiert auf Version 5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'
        cache-dependency-path: 'buergermeldebox-devops-lab/app/pom.xml'

    - name: Anwendung mit Maven testen und bauen
      working-directory: buergermeldebox-devops-lab/app
      # GEÄNDERT: Wir nutzen direkt globales maven statt dem Wrapper, um CRLF-Fehler zu vermeiden
      run: mvn clean package -DskipTests

  # Job 2: Docker Image bauen und auf Sicherheit prüfen
  docker-security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4.2.2

    - name: Docker Image lokal bauen
      working-directory: buergermeldebox-devops-lab/app
      run: |
        docker build -t buergermeldebox:test .

    - name: Docker Image mit Trivy auf Sicherheitslücken scannen
      uses: aquasecurity/trivy-action@0.29.0 #Feste Version verwenden
      with:
        image-ref: 'buergermeldebox:test'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
